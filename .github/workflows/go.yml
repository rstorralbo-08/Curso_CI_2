name: Go

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  test:
    runs-on: ubuntu-latest  # Foque no mais recente primeiro
    env:
      HOST: localhost
      PORT: 5432
      USER: root
      PASSWORD: root
      DBNAME: root
    strategy:
      fail-fast: false # Não cancela os outros se um falhar
      matrix:
        go_version: ['1.24', '1.25'] # Versões estáveis para 2026
    
    steps:
    - uses: actions/checkout@v5 # Atualizado para v4

    - name: Set up Go
      uses: actions/setup-go@v6 # Atualizado para v5
      with:
        go-version: ${{ matrix.go_version }}
      
    - name: Start Database
      # Usando docker-compose up direto. 
      # Dica: No seu docker-compose.yml, adicione um 'healthcheck' ao serviço de banco.
      run: docker-compose up -d

    - name: Wait for DB
      # Em vez de sleep, verificamos se o serviço está saudável
      run: |
        for i in {1..20}; do
          if [ "$(docker inspect -f {{.State.Health.Status}} $(docker-compose ps -q db))" == "healthy" ]; then
            echo "Banco pronto!"
            break
          fi
          echo "Aguardando banco..."
          sleep 2
        done

    - name: Test
      # O ./... garante que ele compile o pacote inteiro antes de testar
      run: go test -v ./... 
      
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    - name: Build
      run: go build -v -o main . # Gera o executável
