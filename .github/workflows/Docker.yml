name: Docker

on:
  workflow_call:

jobs:
  docker:
    runs-on: ubuntu-latest  # Foque no mais recente primeiro

    steps:
    - uses: actions/checkout@v5 # Atualizado para v4

    - name: Set up Docker build
      uses: docker/setup-buildx-action@v4.0.0

    - name: Download a Build Artifact
      uses: actions/download-artifact@v8
      with:
        name: aplicacao-em-go
            
    - name: Docker Login
      uses: docker/login-action@v4.0.0
      with:
        username: torralbo
        password: ${{ secrets.SECRET_DOCKER_HUB }}

    - name: Build and push Docker images
      uses: docker/build-push-action@v7.0.0
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: torralbo/go_ci:${{ github.ref_name }}
